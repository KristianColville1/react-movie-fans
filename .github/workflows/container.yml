name: container

# builds the image on every push to the long lived branches, and rolls magic
# containers onto it when the bunny variables are set
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lower cases the repo name, ghcr rejects capitals
      - name: Work out the image name
        id: name
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_TMDB_KEY=${{ secrets.VITE_TMDB_KEY }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # bunny does not watch the registry, the update has to be triggered.
      # skipped until APP_ID is set, so the build still works without bunny
      - name: Roll magic containers onto the new image
        if: vars.BUNNY_APP_ID != ''
        uses: BunnyWay/actions/container-update-image@main
        with:
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          app_id: ${{ vars.BUNNY_APP_ID }}
          container: ${{ vars.BUNNY_CONTAINER }}
          image_tag: ${{ github.sha }}
