server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # react router owns the paths, so anything not a real file falls back to
    # index.html, otherwise refreshing /movies/123 is a 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed assets never change, the html must not be cached or a deploy
    # leaves people on the old bundle
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
